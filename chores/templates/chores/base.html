<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Chore Tracker{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --border: #ddd;
            --muted: #666;
            --accent: #2563eb;
            --danger: #b91c1c;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 640px;
            margin: 0 auto;
            padding: 1rem 1.5rem 3rem;
            color: #111;
        }
        nav {
            display: flex;
            gap: 1rem;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        nav a {
            font-weight: 600;
            text-decoration: none;
            color: var(--muted);
        }
        nav a:hover { color: var(--accent); }
        h1 { font-size: 1.4rem; margin-bottom: 1rem; }
        ul { list-style: none; padding: 0; margin: 1rem 0; }
        li {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
        }
        li:last-child { border-bottom: none; }
        li strong { margin-right: 0.25rem; }
        form.filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1rem 0;
        }
        form.filters label { font-size: 0.9rem; color: var(--muted); }
        form p { margin: 0.6rem 0; }
        label { display: block; margin-bottom: 0.2rem; font-size: 0.9rem; }
        input, select, textarea {
            padding: 0.4rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
        }
        button, a.button {
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: #f9fafb;
            cursor: pointer;
            font-size: 0.9rem;
            color: #111;
            text-decoration: none;
        }
        button:hover, a.button:hover { border-color: var(--accent); }
        a.add-link {
            display: inline-block;
            margin-bottom: 1rem;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
        }
        .muted { color: var(--muted); font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'chores:chore_list' %}">Chores</a>
        <a href="{% url 'chores:member_list' %}">Members</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
