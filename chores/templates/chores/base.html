<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Chore Tracker{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg-from: #eef2ff;
            --bg-to: #f0fdfa;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
            --accent: #6366f1;
            --accent-soft: #eef2ff;
            --accent-hover: #4f46e5;
            --danger: #e11d48;
            --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 680px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
            color: var(--text);
            background: linear-gradient(160deg, var(--bg-from), var(--bg-to) 60%);
            min-height: 100vh;
        }
        nav {
            display: flex;
            gap: 0.5rem;
            padding: 0.4rem;
            margin-bottom: 2rem;
            background: var(--surface);
            border-radius: 999px;
            box-shadow: var(--shadow);
            width: fit-content;
        }
        nav a {
            font-weight: 600;
            text-decoration: none;
            color: var(--muted);
            padding: 0.5rem 1.1rem;
            border-radius: 999px;
            transition: color 0.2s ease, background-color 0.2s ease;
        }
        nav a:hover { color: var(--accent-hover); background: var(--accent-soft); }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--accent), #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
        ul { list-style: none; padding: 0; margin: 1rem 0; }
        li {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem;
            padding: 0.9rem 1.1rem;
            margin-bottom: 0.6rem;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        li:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(15, 23, 42, 0.06), 0 12px 28px rgba(15, 23, 42, 0.08); }
        li strong { margin-right: 0.25rem; color: var(--text); }
        form.filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1rem 0 1.5rem;
            padding: 0.9rem 1.1rem;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }
        form.filters label { font-size: 0.85rem; color: var(--muted); }
        form p { margin: 0.6rem 0; }
        label { display: block; margin-bottom: 0.25rem; font-size: 0.85rem; color: var(--muted); }
        input, select, textarea {
            padding: 0.5rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--surface);
            color: var(--text);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        button, a.button {
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            text-decoration: none;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
        }
        button:hover, a.button:hover {
            border-color: var(--accent);
            color: var(--accent-hover);
            background: var(--accent-soft);
        }
        button:active, a.button:active { transform: scale(0.97); }
        button[type="submit"] {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        button[type="submit"]:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
        a.add-link {
            display: inline-block;
            margin-bottom: 1.25rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, var(--accent), #06b6d4);
            text-decoration: none;
            box-shadow: var(--shadow);
            transition: opacity 0.2s ease, transform 0.1s ease;
        }
        a.add-link:hover { opacity: 0.9; }
        a.add-link:active { transform: scale(0.98); }
        .muted { color: var(--muted); font-size: 0.85rem; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'chores:chore_list' %}">Chores</a>
        <a href="{% url 'chores:member_list' %}">Members</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
